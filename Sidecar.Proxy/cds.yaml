resources:
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: api_stable
    type: STATIC
    load_assignment:
      cluster_name: api_stable
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8080
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: api_beta
    type: STATIC
    load_assignment:
      cluster_name: api_beta
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8081
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: api_mcp
    type: STATIC
    load_assignment:
      cluster_name: api_mcp
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8082
  - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
    name: otel_collector
    type: STATIC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {} #gRPC strictly requires HTTP/2
    load_assignment:
      cluster_name: otel_collector
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 4317
