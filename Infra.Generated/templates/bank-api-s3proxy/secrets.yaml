---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "bank-api-s3proxy-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "bank-api-s3proxy"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  ASPNETCORE_ENVIRONMENT: {{ tpl "{{ .Values.secrets.bank_api_s3proxy.ASPNETCORE_ENVIRONMENT }}" . | quote }}
  AZURE_TENANT_ID: {{ tpl "{{ .Values.secrets.bank_api_s3proxy.AZURE_TENANT_ID }}" . | quote }}
  AZURE_CLIENT_ID: {{ tpl "{{ .Values.secrets.bank_api_s3proxy.AZURE_CLIENT_ID }}" . | quote }}
  AZURE_CLIENT_SECRET: {{ tpl "{{ .Values.secrets.bank_api_s3proxy.AZURE_CLIENT_SECRET }}" . | quote }}
type: "Opaque"
