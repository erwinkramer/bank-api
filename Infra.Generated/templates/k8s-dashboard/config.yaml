---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "k8s-dashboard-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "k8s-dashboard"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: {{ tpl "{{ .Values.config.k8s_dashboard.ASPIRE_DASHBOARD_TELEMETRY_OPTOUT }}" . | quote }}
