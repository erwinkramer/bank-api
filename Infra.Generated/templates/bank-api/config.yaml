---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "bank-api-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "bank-api"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: {{ tpl "{{ .Values.config.bank_api.OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY }}" . | quote }}
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: {{ tpl "{{ .Values.config.bank_api.ASPNETCORE_FORWARDEDHEADERS_ENABLED }}" . | quote }}
  HTTP_PORTS: {{ tpl "{{ .Values.parameters.bank_api.port_http | int | toString }}" . | quote }}
  BANK_API_DB_HOST: {{ tpl "{{ .Values.config.bank_api.BANK_API_DB_HOST }}" . | quote }}
  BANK_API_DB_PORT: {{ tpl "{{ .Values.config.bank_api.BANK_API_DB_PORT }}" . | quote }}
  BANK_API_DB_USERNAME: {{ tpl "{{ .Values.config.bank_api.bank_api_db_username }}" . | quote }}
  BANK_API_DB_JDBCCONNECTIONSTRING: {{ tpl "{{ .Values.config.bank_api.BANK_API_DB_JDBCCONNECTIONSTRING }}" . | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ tpl "{{ .Values.config.bank_api.OTEL_EXPORTER_OTLP_ENDPOINT }}" . | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ tpl "{{ .Values.config.bank_api.OTEL_EXPORTER_OTLP_PROTOCOL }}" . | quote }}
  OTEL_SERVICE_NAME: {{ tpl "{{ .Values.config.bank_api.OTEL_SERVICE_NAME }}" . | quote }}
