---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "bank-api-beta-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "bank-api-beta"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  ConnectionStrings__bank_api_db: {{ tpl "Host=bank-api-db-service;Port=5432;Username={{ .Values.config.bank_api_beta.bank_api_db_username }};Password={{ .Values.secrets.bank_api_beta.bank_api_db_password }}" . | quote }}
  BANK_API_DB_PASSWORD: {{ tpl "{{ .Values.secrets.bank_api_beta.bank_api_db_password }}" . | quote }}
  BANK_API_DB_URI: {{ tpl "postgresql://{{ .Values.config.bank_api_beta.bank_api_db_username }}:{{ .Values.secrets.bank_api_beta.bank_api_db_password }}@bank-api-db-service:5432" . | quote }}
type: "Opaque"
